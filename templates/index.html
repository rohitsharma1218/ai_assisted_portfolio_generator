<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ResumeAI</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body class="home-page">

    <!-- Animated background -->
    <div class="background-grid"></div>

    <div class="glow glow-one"></div>
    <div class="glow glow-two"></div>

    <!-- Main application -->
    <main class="chat-container">

        <div class="brand">
            <div class="brand-dot"></div>
            <span>RESUME<span class="blue-text">AI</span></span>
        </div>

        <section class="hero">

            <div class="hero-badge">
                <span class="status-dot"></span>
                AI PORTFOLIO GENERATOR
            </div>

            <h1>
                Turn your resume into
                <span class="gradient-text">something remarkable.</span>
            </h1>

            <p class="hero-description">
                Paste your resume below and let AI transform your
                experience into a professional portfolio.
            </p>

        </section>


        <!-- Resume input -->
        <form action="/generate" method="POST" class="resume-form">

            <div class="input-wrapper">

                <div class="input-topbar">
                    <div class="window-dots">
                        <span></span>
                        <span></span>
                        <span></span>
                    </div>

                    <span class="input-label">
                        RESUME INPUT
                    </span>

                    <span class="secure-label">
                        LOCAL PROCESSING
                    </span>
                </div>

                <textarea
                    name="resume"
                    id="resume"
                    placeholder="Paste your complete resume here...

Example:

Name: John Doe

Education:
B.Tech in Computer Science

Skills:
Python, Java, HTML, CSS

Projects:
Smart Resume Analyzer
Restaurant Website

Experience:
Software Developer Intern..."
                    required
                ></textarea>

                <div class="input-footer">

                    <span id="charCount">
                        0 characters
                    </span>

                    <button type="submit" class="generate-btn">

                        <span>Generate Portfolio</span>

                        <span class="arrow">
                            →
                        </span>

                    </button>

                </div>

            </div>

        </form>


        <div class="process-info">

            <div class="process-item">
                <span>01</span>
                <p>Analyze</p>
            </div>

            <div class="process-line"></div>

            <div class="process-item">
                <span>02</span>
                <p>Structure</p>
            </div>

            <div class="process-line"></div>

            <div class="process-item">
                <span>03</span>
                <p>Generate</p>
            </div>

        </div>

    </main>


    <script>

        const textarea = document.getElementById("resume");
        const charCount = document.getElementById("charCount");

        textarea.addEventListener("input", () => {

            const count = textarea.value.length;

            charCount.textContent =
                `${count.toLocaleString()} characters`;

        });

    </script>

</body>
</html>
